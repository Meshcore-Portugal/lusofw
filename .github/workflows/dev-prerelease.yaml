name: Build lusofw (dev prerelease)

permissions:
  contents: write

on:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}
    steps:
      - name: Clone repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      - name: Decide whether to cut a new prerelease
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          VERSION=$(grep '^[[:space:]]*#define[[:space:]]\+LUSOFW_FIRMWARE_VERSION[[:space:]]\+"' examples/simple_repeater/MyMesh.h | \
            sed -E 's/^[[:space:]]*#define[[:space:]]+LUSOFW_FIRMWARE_VERSION[[:space:]]+"([^"]+)".*/\1/')

          if [[ -z "${VERSION}" ]]; then
            echo "Failed to extract LUSOFW_FIRMWARE_VERSION from examples/simple_repeater/MyMesh.h"
            exit 1
          fi

          # Ensure the version (and therefore the tag) always carries a "v" prefix.
          if [[ "${VERSION}" != v* ]]; then
            VERSION="v${VERSION}"
          fi

          echo "Current LUSOFW_FIRMWARE_VERSION: ${VERSION}"

          # Only cut a dev prerelease when the version is itself a release
          # candidate (e.g. v1.2.3-rc1, v1.2.3-rc2). Stable or plain dev
          # versions are left alone.
          if [[ ! "${VERSION}" =~ -rc[0-9]+ ]]; then
            echo "Version ${VERSION} is not a release candidate (-rc<N>); skipping prerelease."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A new prerelease is cut only when the version (without the git hash)
          # has no prerelease yet. Candidate tags are gathered from *both* GitHub
          # releases and the raw remote tags, so a transient `gh` API hiccup
          # can't make us miss an existing prerelease and cut a duplicate.
          #
          # A tag belongs to ${VERSION} when it equals ${VERSION} exactly or
          # starts with "${VERSION}-" (the ${VERSION}-<sha> form produced by the
          # release job). Matching is literal (awk index/==, not regex) so dots
          # in the version are treated as literals and rc2 does not falsely
          # match rc20.
          ALL_TAGS="$({
            gh release list --prereleases --json tagName -L 200 \
              --jq '.[].tagName' 2>/dev/null || true
            git ls-remote --tags origin 2>/dev/null \
              | sed -E 's#.*refs/tags/##; s/\^\{\}$//' || true
          } | sort -u)"

          EXISTING="$(awk -v v="${VERSION}" '
            $0 == v || index($0, v "-") == 1 { print }
          ' <<< "${ALL_TAGS}")"

          if [[ -n "${EXISTING}" ]]; then
            echo "Existing prerelease(s)/tag(s) for ${VERSION}:"
            echo "${EXISTING}"
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "No prerelease exists yet for ${VERSION}; will build."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 15
      matrix:
        firmware:
          - Heltec_t114_companion_radio_ble
          - Heltec_t114_repeater
          - Heltec_t114_repeater_bridge_rs232
          - Heltec_t114_without_display_repeater
          - Heltec_t114_without_display_repeater_bridge_rs232
          - Heltec_v3_companion_radio_ble
          - Heltec_v3_repeater
          - Heltec_v3_repeater_bridge_espnow
          - Heltec_v3_repeater_bridge_rs232
          - heltec_v4_companion_radio_ble
          - heltec_v4_repeater
          - heltec_v4_repeater_bridge_espnow
          - heltec_v4_tft_repeater
          - heltec_v4_tft_repeater_bridge_espnow
          - Heltec_WSL3_repeater
          - Heltec_WSL3_repeater_bridge_espnow
          - Heltec_WSL3_repeater_bridge_rs232
          - LilyGo_T3S3_sx1262_repeater
          - LilyGo_T3S3_sx1262_repeater_bridge_espnow
          - LilyGo_T3S3_sx1276_repeater
          - LilyGo_T3S3_sx1276_repeater_bridge_espnow
          - LilyGo_TLora_V2_1_1_6_repeater
          - LilyGo_TLora_V2_1_1_6_repeater_bridge_espnow
          - LilyGo_TLora_V2_1_1_6_repeater_bridge_rs232
          - ProMicro_repeater
          - ProMicro_repeater_bridge_rs232_serial1
          - RAK_3112_repeater
          - RAK_3112_repeater_bridge_espnow
          - RAK_3112_repeater_bridge_rs232
          - RAK_4631_repeater
          - RAK_4631_repeater_bridge_rs232_serial1
          - RAK_4631_repeater_bridge_rs232_serial2
          - SenseCap_Solar_repeater
          - SenseCap_Solar_repeater_bridge_rs232
          - T_Beam_S3_Supreme_SX1262_repeater
          - T_Beam_S3_Supreme_SX1262_repeater_bridge_espnow
          - Tbeam_SX1262_repeater
          - Tbeam_SX1262_repeater_bridge_espnow
          - Tbeam_SX1276_repeater
          - Tbeam_SX1276_repeater_bridge_espnow
          - Xiao_nrf52_repeater
          - Xiao_nrf52_repeater_bridge_rs232
          - Xiao_S3_WIO_repeater
          - Xiao_S3_WIO_repeater_bridge_espnow
          - Xiao_S3_WIO_repeater_bridge_rs232
    steps:
      - name: Clone repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      - name: Init Cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
            ~/.platformio/lib
          key: ${{ runner.os }}-pio-${{ matrix.firmware }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        shell: bash
        run: pip install --upgrade platformio

      - name: Update PlatformIO dependencies
        shell: bash
        run: pio pkg update -d . -e ${{ matrix.firmware }}

      - name: Extract versions
        run: |
          FIRMWARE_VERSION=$(grep '^[[:space:]]*#define[[:space:]]\+FIRMWARE_VERSION[[:space:]]\+"' examples/simple_repeater/MyMesh.h | \
            sed -E 's/^[[:space:]]*#define[[:space:]]+FIRMWARE_VERSION[[:space:]]+"v([0-9.]+)".*/v\1/')
          LUSOFW_FIRMWARE_VERSION=$(grep '^[[:space:]]*#define[[:space:]]\+LUSOFW_FIRMWARE_VERSION[[:space:]]\+"' examples/simple_repeater/MyMesh.h | \
            sed -E 's/^[[:space:]]*#define[[:space:]]+LUSOFW_FIRMWARE_VERSION[[:space:]]+"([^"]+)".*/\1/')
          echo "FIRMWARE_VERSION=${FIRMWARE_VERSION}" >> "$GITHUB_ENV"
          echo "LUSOFW_FIRMWARE_VERSION=${LUSOFW_FIRMWARE_VERSION}" >> "$GITHUB_ENV"

      - name: Build Firmware
        env:
          FIRMWARE_VERSION: ${{ env.FIRMWARE_VERSION }}
          LUSOFW_FIRMWARE_VERSION: ${{ env.LUSOFW_FIRMWARE_VERSION }}
        run: /usr/bin/env bash build.sh build-firmware ${{ matrix.firmware }}

      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.firmware }}
          path: out

  release:
    needs: [check, build]
    if: needs.check.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      - name: Compute release tag
        shell: bash
        run: |
          set -euo pipefail

          LUSOFW_FIRMWARE_VERSION=$(grep '^[[:space:]]*#define[[:space:]]\+LUSOFW_FIRMWARE_VERSION[[:space:]]\+"' examples/simple_repeater/MyMesh.h | \
            sed -E 's/^[[:space:]]*#define[[:space:]]+LUSOFW_FIRMWARE_VERSION[[:space:]]+"([^"]+)".*/\1/')
          SHORT_SHA=$(git rev-parse --short HEAD)

          if [[ -z "${LUSOFW_FIRMWARE_VERSION}" ]]; then
            echo "Failed to extract LUSOFW_FIRMWARE_VERSION from examples/simple_repeater/MyMesh.h"
            exit 1
          fi

          # Ensure the version (and therefore the tag) always carries a "v" prefix.
          if [[ "${LUSOFW_FIRMWARE_VERSION}" != v* ]]; then
            LUSOFW_FIRMWARE_VERSION="v${LUSOFW_FIRMWARE_VERSION}"
          fi

          echo "RELEASE_TAG=${LUSOFW_FIRMWARE_VERSION}-${SHORT_SHA}" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=${LUSOFW_FIRMWARE_VERSION}" >> "$GITHUB_ENV"
          echo "RELEASE_SHA=${SHORT_SHA}" >> "$GITHUB_ENV"

      - name: Create and push prerelease tag
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Tag ${RELEASE_TAG} already exists on remote; reusing it."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "${RELEASE_TAG}"
            git push origin "${RELEASE_TAG}"
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Generate release notes
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION}"
          sha="${RELEASE_SHA}"

          {
            echo "Automated dev prerelease of dev@${sha} for ${version}."
            echo ""

            if [[ ! -f CHANGELOG.md ]]; then
              echo "CHANGELOG.md not found."
              exit 0
            fi

            awk -v tag="UNRELEASED" '
              BEGIN { capture=0 }
              $0 ~ "^##[[:space:]]*\\[" tag "\\]" || $0 ~ "^##[[:space:]]*" tag "([[:space:]]|$)" {
                capture=1
                next
              }
              capture && $0 ~ "^##[[:space:]]" { exit }
              capture { print }
            ' CHANGELOG.md

          } > release_body.md

          if [[ ! -s release_body.md ]] || [[ $(wc -l < release_body.md) -le 2 ]]; then
            {
              echo "Automated dev prerelease of dev@${sha} for ${version}."
              echo ""
              echo "No UNRELEASED changelog entries found."
            } > release_body.md
          fi

      - name: Generate SHA1 checksums
        shell: bash
        run: |
          set -euo pipefail
          find out -type f ! -name '*.sha1' | while read -r f; do
            sha1sum "$f" | awk '{print $1}' > "${f}.sha1"
          done

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          body_path: release_body.md
          draft: false
          prerelease: true
          files: out/*
