name: Build lusofw (main release)

permissions:
  contents: write

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}
    steps:
      - name: Clone repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      - name: Decide whether to cut a new main release
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          VERSION=$(sed -nE 's/^[[:space:]]*-D[[:space:]]*FIRMWARE_VERSION=[^0-9a-zA-Z._-]*([0-9a-zA-Z._-]+).*/\1/p' platformio.ini)
          [[ -n "${VERSION}" ]] || { echo "Failed to extract FIRMWARE_VERSION from platformio.ini" >&2; exit 1; }
          VERSION="v${VERSION#v}"

          echo "Current FIRMWARE_VERSION: ${VERSION}"

          # Manual workflow dispatch forces build and replaces any existing release.
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "Workflow dispatched manually: forcing build and release."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Skip cutting a main release when the version is a release
          # candidate (e.g. v1.2.3-rc1, v1.2.3-rc2). Only non-rc versions
          # are allowed to proceed.
          if [[ "${VERSION}" =~ -rc[0-9]+ ]]; then
            echo "Version ${VERSION} is a release candidate (-rc<N>); skipping release."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A new main release is cut only when its exact tag does not exist.
          # Query both GitHub releases and raw remote tags, so a transient `gh`
          # API hiccup cannot create a duplicate release. RC tags use the same
          # version prefix, but do not block the final release.
          ALL_TAGS="$({
            gh release list --json tagName -L 200 \
              --jq '.[].tagName' 2>/dev/null || true
            git ls-remote --tags origin 2>/dev/null \
              | sed -E 's#.*refs/tags/##; s/\^\{\}$//' || true
          } | sort -u)"

          EXISTING="$(awk -v v="${VERSION}" '
            $0 == v { print }
          ' <<< "${ALL_TAGS}")"

          if [[ -n "${EXISTING}" ]]; then
            echo "Existing release(s)/tag(s) for ${VERSION}:"
            echo "${EXISTING}"
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "No release exists yet for ${VERSION}; will build."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 15
      matrix:
        firmware:
          - Heltec_t114_companion_radio_ble
          - Heltec_t114_repeater
          - Heltec_t114_repeater_bridge_rs232
          - Heltec_t114_without_display_repeater
          - Heltec_t114_without_display_repeater_bridge_rs232
          - Heltec_v3_companion_radio_ble
          - Heltec_v3_repeater
          - Heltec_v3_repeater_bridge_espnow
          - Heltec_v3_repeater_bridge_rs232
          - heltec_v4_companion_radio_ble
          - heltec_v4_repeater
          - heltec_v4_repeater_bridge_espnow
          - heltec_v4_tft_repeater
          - heltec_v4_tft_repeater_bridge_espnow
          - Heltec_WSL3_repeater
          - Heltec_WSL3_repeater_bridge_espnow
          - Heltec_WSL3_repeater_bridge_rs232
          - LilyGo_T3S3_sx1262_repeater
          - LilyGo_T3S3_sx1262_repeater_bridge_espnow
          - LilyGo_T3S3_sx1276_repeater
          - LilyGo_T3S3_sx1276_repeater_bridge_espnow
          - LilyGo_TBeam_1W_repeater
          - LilyGo_TLora_V2_1_1_6_repeater
          - LilyGo_TLora_V2_1_1_6_repeater_bridge_espnow
          - LilyGo_TLora_V2_1_1_6_repeater_bridge_rs232
          - ProMicro_repeater
          - ProMicro_repeater_bridge_rs232_serial1
          - RAK_3112_repeater
          - RAK_3112_repeater_bridge_espnow
          - RAK_3112_repeater_bridge_rs232
          - RAK_3401_repeater
          - RAK_4631_repeater
          - RAK_4631_repeater_bridge_rs232_serial1
          - RAK_4631_repeater_bridge_rs232_serial2
          - SenseCap_Solar_repeater
          - SenseCap_Solar_repeater_bridge_rs232
          - T_Beam_S3_Supreme_SX1262_repeater
          - T_Beam_S3_Supreme_SX1262_repeater_bridge_espnow
          - Tbeam_SX1262_repeater
          - Tbeam_SX1262_repeater_bridge_espnow
          - Tbeam_SX1276_repeater
          - Tbeam_SX1276_repeater_bridge_espnow
          - Xiao_nrf52_repeater
          - Xiao_nrf52_repeater_bridge_rs232
          - Xiao_S3_WIO_repeater
          - Xiao_S3_WIO_repeater_bridge_espnow
          - Xiao_S3_WIO_repeater_bridge_rs232
    steps:
      - name: Clone repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      - name: Init Cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
            ~/.platformio/lib
          key: ${{ runner.os }}-pio-${{ matrix.firmware }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        shell: bash
        run: pip install --upgrade platformio

      - name: Update PlatformIO dependencies
        shell: bash
        run: pio pkg update -d . -e ${{ matrix.firmware }}

      - name: Extract version
        run: |
          sed -nE 's/^[[:space:]]*-D[[:space:]]*(FIRMWARE_VERSION)=[^0-9a-zA-Z._-]*([0-9a-zA-Z._-]+).*/\1=\2/p' platformio.ini >> "$GITHUB_ENV"

      - name: Build Firmware
        env:
          DISABLE_DEBUG: 1
          FIRMWARE_VERSION: ${{ env.FIRMWARE_VERSION }}
        run: /usr/bin/env bash build.sh build-firmware ${{ matrix.firmware }}

      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.firmware }}
          path: out

  release:
    needs: [check, build]
    if: needs.check.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      - name: Compute release tag
        shell: bash
        run: |
          set -euo pipefail

          FIRMWARE_VERSION=$(sed -nE 's/^[[:space:]]*-D[[:space:]]*FIRMWARE_VERSION=[^0-9a-zA-Z._-]*([0-9a-zA-Z._-]+).*/\1/p' platformio.ini)
          SHORT_SHA=$(git describe --always --dirty=* --exclude='*')

          [[ -n "${FIRMWARE_VERSION}" ]] || { echo "Failed to extract FIRMWARE_VERSION from platformio.ini" >&2; exit 1; }
          FIRMWARE_VERSION="v${FIRMWARE_VERSION#v}"

          echo "RELEASE_TAG=${FIRMWARE_VERSION}" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=${FIRMWARE_VERSION}" >> "$GITHUB_ENV"
          echo "RELEASE_SHA=${SHORT_SHA}" >> "$GITHUB_ENV"

      - name: Delete existing release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} exists; deleting..."
            gh release delete "${RELEASE_TAG}" --yes
          else
            echo "Release ${RELEASE_TAG} does not exist; skipping delete."
          fi

      - name: Create and push release tag
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            git tag -f "${RELEASE_TAG}" HEAD
            git push origin "refs/tags/${RELEASE_TAG}" --force
          elif git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Tag ${RELEASE_TAG} already exists on remote; reusing it."
          else
            git tag "${RELEASE_TAG}"
            git push origin "${RELEASE_TAG}"
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Generate release notes from CHANGELOG
        shell: bash
        run: |
          set -euo pipefail
          tag="${RELEASE_VERSION}"

          if [[ ! -f CHANGELOG.md ]]; then
            echo "CHANGELOG.md not found; using empty release notes." > release_body.md
            exit 0
          fi

          awk -v tag="$tag" '
            BEGIN { capture=0 }
            $0 ~ "^##[[:space:]]*\\[" tag "\\]" || $0 ~ "^##[[:space:]]*" tag "([[:space:]]|$)" {
              capture=1
              next
            }
            capture && $0 ~ "^##[[:space:]]" { exit }
            capture { print }
          ' CHANGELOG.md > release_body.md

          if [[ ! -s release_body.md ]]; then
            awk '
              BEGIN { capture=0 }
              /^##[[:space:]]/ {
                if (capture == 1) exit
                capture=1
                next
              }
              capture { print }
            ' CHANGELOG.md > release_body.md
          fi

      - name: Generate SHA1 checksums
        shell: bash
        run: |
          set -euo pipefail
          find out -type f ! -name '*.sha1' | while read -r f; do
            sha1sum "$f" | awk '{print $1}' > "${f}.sha1"
          done

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          body_path: release_body.md
          draft: false
          prerelease: false
          files: out/*

      - name: Send Telegram notification
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          THREAD_ID: ${{ secrets.TELEGRAM_THREAD_ID }}
          RELEASE_URL: ${{ steps.create_release.outputs.url }}
          RELEASE_NAME: ${{ env.RELEASE_TAG }}
          IS_PRERELEASE: false
        run: |
          TYPE=$([ "${IS_PRERELEASE}" = "true" ] && echo "Pre-release (RC)" || echo "Production Release")
          MSG=$(printf '🚀 <b>New %s:</b> <a href="%s">%s</a>\n\nPode flashar online através do <a href="https://meshcore.pt/tools/flasher">firmware flasher</a>.' "${TYPE}" "${RELEASE_URL}" "${RELEASE_NAME}")

          PAYLOAD=$(jq -n \
            --arg chat_id "${CHAT_ID}" \
            --arg text "${MSG}" \
            --arg thread_id "${THREAD_ID}" \
            '{"chat_id": $chat_id, "parse_mode": "HTML", "text": $text} + (if $thread_id != "" then {"message_thread_id": ($thread_id | tonumber)} else {} end)')

          curl -fsS -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "${PAYLOAD}"
